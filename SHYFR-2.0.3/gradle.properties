android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official

# ---- SHYFR: centralny adres backendu (HTTPS), jedyne miejsce konfiguracji ----
# Wpisz adres po wdrożeniu serwera (backend/ + SERVER_DEPLOYMENT.md), np. shyfr2ApiBaseUrl=https://api.twoja-domena.pl
# W CI nadpisuje go zmienna repozytorium SHYFR2_API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables).
# Pusty = backend NIEWDROŻONY: aplikacja pokaże to wprost i nie połączy się z niczym. Nie zgadujemy żadnego adresu.
shyfr2ApiBaseUrl=https://shyfr.onrender.com/

# ---- SHYFR: wersja libsignal (E2EE; AGPL-3.0). Jedyne miejsce, w którym przypinamy wersję. ----
# Wersja istnieje w Maven Central (org.signal:libsignal-android). API zależy od wersji (0.63.0: saveIdentity zwraca Boolean, markKyberPreKeyUsed(id), Curve.generateKeyPair, SenderKeyStore w SignalProtocolStore).
# app/src/main/java/com/shyfr/app/e2ee/LibsignalMessageCipher.kt (zwł. KyberPreKeyStore.markKyberPreKeyUsed, SessionCipher, SessionBuilder).
libsignalVersion=0.63.0
