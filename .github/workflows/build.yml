
name: Build SHYFR APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SHYFR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalacja Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rozpakuj projekt
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -name 'SHYFR*.zip' -type f | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Brak ZIP SHYFR."
            exit 1
          fi

          mkdir -p /tmp/shyfr-source
          unzip -q "$ZIP" -d /tmp/shyfr-source

          PROJECT=$(find /tmp/shyfr-source \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -1)

          test -f "$PROJECT/app/build.gradle.kts"

          echo "SHYFR_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Automatyczna konfiguracja Signal Desugaring
        shell: bash
        run: |
          set -e

          FILE="$SHYFR_DIR/app/build.gradle.kts"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled" not in s:
              marker = "compileOptions {"
              if marker not in s:
                  raise SystemExit("Nie znaleziono compileOptions w build.gradle.kts")

              s = s.replace(
                  marker,
                  marker + "\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(" not in s:
              marker = "dependencies {"
              if marker not in s:
                  raise SystemExit("Nie znaleziono dependencies w build.gradle.kts")

              s = s.replace(
                  marker,
                  marker + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                  1
              )

          p.write_text(s)
          print("Desugaring skonfigurowany.")
          PY

      - name: Budowanie APK
        shell: bash
        run: |
          set -o pipefail
          cd "$SHYFR_DIR"

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Diagnostyka błędów
        if: failure()
        shell: bash
        run: |
          echo "=== BŁĘDY SHYFR ==="

          if [ -f build.log ]; then
            grep -Ei \
              'error:|^e: |AAPT|Could not|Unresolved|FAILED|What went wrong' \
              build.log | head -100 || true
          else
            echo "Błąd przed uruchomieniem Gradle."
          fi

      - name: Przygotuj APK
        if: success()
        run: |
          set -e

          APK="$SHYFR_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          mkdir -p output
          cp "$APK" output/SHYFR-debug.apk

      - name: Udostępnij APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHYFR-debug-APK
          path: output/SHYFR-debug.apk
          if-no-files-found: error

      - name: Zapisz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHYFR-build-log
          path: build.log
          if-no-files-found: ignore
