
name: Build SHYFR APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj SHYFR
        shell: bash
        run: |
          ZIP=$(ls -t SHYFR*.zip | head -n1)
          echo "Używam: $ZIP"
          mkdir -p /tmp/shyfr-unpack SHYFR
          unzip -q "$ZIP" -d /tmp/shyfr-unpack
          cp -a /tmp/shyfr-unpack/SHYFR-2.0.3/. SHYFR/
          test -f SHYFR/app/build.gradle.kts
          test -f SHYFR/settings.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Zainstaluj Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Zbuduj APK
        working-directory: SHYFR
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain \
            -PgitSha=${GITHUB_SHA} 2>&1 | tee build.log

      - name: Pokaż błędy kompilacji
        if: failure()
        working-directory: SHYFR
        shell: bash
        run: |
          grep -E '^e: |error:|AAPT|Could not|Unresolved|FAILED' build.log | head -60 || true

      - name: Przygotuj APK
        run: |
          cp SHYFR/app/build/outputs/apk/debug/app-debug.apk SHYFR-debug.apk

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: shyfr-debug-apk
          path: SHYFR-debug.apk
          if-no-files-found: error
