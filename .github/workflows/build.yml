
name: Build SHYFR APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Zainstaluj wymagane SDK
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rozpakuj SHYFR
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -name 'SHYFR*.zip' -type f | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Nie znaleziono ZIP SHYFR."
            exit 1
          fi

          mkdir -p /tmp/shyfr-source
          unzip -q "$ZIP" -d /tmp/shyfr-source

          PROJECT=$(find /tmp/shyfr-source \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "::error::Nie znaleziono projektu Gradle."
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle.kts"

          echo "SHYFR_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projekt znaleziony: $PROJECT"

      - name: Budowanie APK
        shell: bash
        run: |
          set +e

          cd "$SHYFR_DIR"

          gradle assembleDebug \
            --no-daemon \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          RESULT=${PIPESTATUS[0]}
          exit "$RESULT"

      - name: Pokaż błędy
        if: failure()
        shell: bash
        run: |
          echo "=== BŁĘDY SHYFR ==="

          if [ -f build.log ]; then
            grep -Ei \
              'error:|^e: |AAPT|Could not|Unresolved|FAILED|What went wrong' \
              build.log | head -80 || true
          else
            echo "Brak build.log. Sprawdź wcześniejsze kroki."
          fi

      - name: Przygotuj APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$SHYFR_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p output
          cp "$APK" output/SHYFR-debug.apk

      - name: Udostępnij APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHYFR-debug-APK
          path: output/SHYFR-debug.apk
          if-no-files-found: error

      - name: Udostępnij log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHYFR-build-log
          path: build.log
          if-no-files-found: ignore
