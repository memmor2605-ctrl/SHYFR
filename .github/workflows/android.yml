
name: SHYFR Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set backend URL
        run: |
          echo "Backend URL configured: ${{ vars.SHYFR2_API_BASE_URL != '' }}"
      
      - name: Build SHYFR APK
        env:
          SHYFR2_API_BASE_URL: ${{ vars.SHYFR2_API_BASE_URL }}
        run: |
          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts not found in repository root"
            exit 1
          }
          gradle --no-daemon assembleDebug \
            -Pshyfr2ApiBaseUrl="$SHYFR2_API_BASE_URL"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHYFR-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
