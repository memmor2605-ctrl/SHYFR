name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  API_URL: ${{ vars.SHYFR2_API_BASE_URL }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUDOWANIE APK. Nie zależy od testów ani linta: błąd testu nie odbiera APK.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Konfiguracja Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Licencje i pakiety Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      # Gradle 8.13 instalowany przez akcję: nie wymaga gradlew ani gradle-wrapper.jar w repozytorium.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Sprawdzenie struktury projektu
        run: |
          test -f settings.gradle.kts || { echo "::error::Brak settings.gradle.kts w głównym katalogu repozytorium"; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::Brak app/build.gradle.kts"; exit 1; }
          gradle --version

      - name: Budowanie APK (debug)
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Pshyfr2ApiBaseUrl="$API_URL" \
            -PgitSha="${{ github.sha }}"

      - name: Publikacja APK debug
        uses: actions/upload-artifact@v4
        with:
          name: shyfr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Budowanie APK (release, niepodpisany)
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pshyfr2ApiBaseUrl="$API_URL" \
            -PgitSha="${{ github.sha }}"

      - name: Weryfikacja APK release
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK" && unzip -tq "$APK" >/dev/null || {
            echo "::error::Brak lub uszkodzony APK release"; exit 1; }
          {
            echo "### SHYFR: APK"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- APK release: $APK ($(stat -c%s "$APK") B), NIEPODPISANY"
            echo "- adres backendu: $([ -n "$API_URL" ] && echo ustawiony || echo NIEUSTAWIONY)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publikacja APK release
        uses: actions/upload-artifact@v4
        with:
          name: shyfr-release-apk-niepodpisany
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) TESTY BACKENDU (Python)
  # ---------------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Składnia Pythona
        run: python -m compileall -q backend tools

      - name: Testy serwera
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

  # ---------------------------------------------------------------------------
  # 3) TESTY ANDROIDA I LINT. Osobny job: ich porażka nie blokuje APK z jobu "build".
  # ---------------------------------------------------------------------------
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Konfiguracja Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Licencje i pakiety Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Uruchom backend do testów integracyjnych
        run: |
          mkdir -p "$RUNNER_TEMP/shyfr-db"
          (
            cd backend
            SHYFR_DB_PATH="$RUNNER_TEMP/shyfr-db/ci.db" SHYFR_PORT=18080 \
              nohup python -m shyfr_server.server > "$RUNNER_TEMP/backend.log" 2>&1 &
          )
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/readyz || { cat "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: Testy jednostkowe i integracyjne klienta
        env:
          SHYFR2_TEST_URL: http://127.0.0.1:18080
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace \
            -Pshyfr2ApiBaseUrl="$API_URL" \
            -PgitSha="${{ github.sha }}"

      - name: Podsumowanie testów
        if: always()
        run: python tools/junit_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint
        continue-on-error: true
        run: |
          gradle lintDebug --no-daemon \
            -Pshyfr2ApiBaseUrl="$API_URL" \
            -PgitSha="${{ github.sha }}"

      - name: Lint, raport (ostrzeżenie, nie blokuje)
        if: always()
        continue-on-error: true
        run: python tools/lint_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zatrzymaj backend
        if: always()
        run: pkill -f '[s]hyfr_server.server' || true

      - name: Raporty testów i lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow-i-lint
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
