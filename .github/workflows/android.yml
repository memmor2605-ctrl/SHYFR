
name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Składnia Pythona (backend, narzędzia)
        run: python -m compileall -q backend tools

      - name: Testy serwera 2.0 (wszystkie moduły)
        working-directory: backend
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee ../backend-tests.log

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "- testy serwera 2.0 (Python): $(grep -E '^Ran ' backend-tests.log || echo 'NIE URUCHOMIONO'), $(tail -1 backend-tests.log)"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Nie używamy android-actions/setup-android.
      # Ta akcja próbowała pobierać nieistniejący pakiet "tools".
      - name: Konfiguracja Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Akceptacja licencji Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalacja wymaganych pakietów Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdzenie struktury projektu
        run: |
          test -f settings.gradle.kts || {
            echo "::error::Brak settings.gradle.kts w głównym katalogu repozytorium"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "::error::Brak app/build.gradle.kts"
            exit 1
          }

          test -d backend || {
            echo "::error::Brak katalogu backend"
            exit 1
          }

      - name: Gradle Wrapper
        id: wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "::warning::Brak Gradle Wrapper. Generuję go na potrzeby builda."
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Wrapper do zatwierdzenia w repozytorium
        if: steps.wrapper.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-do-zatwierdzenia
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties

      - name: Informacje o buildzie
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VC=$(grep -m1 'versionCode' app/build.gradle.kts | sed 's/[^0-9]*//g')
          LS=$(grep -m1 '^libsignalVersion=' gradle.properties | cut -d= -f2)

          {
            echo "### SHYFR: informacje o buildzie"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- wersja: ${VN} (kod ${VC}), libsignal ${LS}"

            if [ -n "${{ vars.SHYFR2_API_BASE_URL }}" ]; then
              echo "- adres backendu: ustawiony"
            else
              echo "- adres backendu: NIEUSTAWIONY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Budowanie APK (debug)
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pshyfr2ApiBaseUrl="${{ vars.SHYFR2_API_BASE_URL }}" \
            -PgitSha="${{ github.sha }}"

      - name: Publikacja APK debug
        uses: actions/upload-artifact@v4
        with:
          name: shyfr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Uruchom backend 2.0 do testów integracyjnych
        run: |
          mkdir -p "$RUNNER_TEMP/shyfr-db"

          (
            cd backend
            SHYFR_DB_PATH="$RUNNER_TEMP/shyfr-db/ci.db" \
            SHYFR_PORT=18080 \
            nohup python -m shyfr_server.server > "$RUNNER_TEMP/backend.log" 2>&1 &
          )

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/readyz || {
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          }

      - name: Testy jednostkowe i integracyjne klienta
        env:
          SHYFR2_TEST_URL: http://127.0.0.1:18080
        run: |
          ./gradlew testDebugUnitTest --no-daemon \
            -Pshyfr2ApiBaseUrl="${{ vars.SHYFR2_API_BASE_URL }}" \
            -PgitSha="${{ github.sha }}"

      - name: Podsumowanie testów
        if: always()
        run: |
          python tools/junit_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Weryfikacja testów integracyjnych
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          path = "app/build/test-results/testDebugUnitTest/TEST-com.shyfr.app.api.BackendIntegrationTest.xml"
          r = ET.parse(path).getroot()

          t = int(r.get("tests"))
          s = int(r.get("skipped"))

          print(f"BackendIntegrationTest: {t} testów, {s} pominiętych")
          sys.exit(1 if t == 0 or s == t else 0)
          PY

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          ./gradlew lintDebug --no-daemon \
            -Pshyfr2ApiBaseUrl="${{ vars.SHYFR2_API_BASE_URL }}" \
            -PgitSha="${{ github.sha }}"

      - name: Lint - raport
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "::error::Zadanie lintDebug zakończyło się błędem"
          fi

          python tools/lint_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Budowanie APK release
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pshyfr2ApiBaseUrl="${{ vars.SHYFR2_API_BASE_URL }}" \
            -PgitSha="${{ github.sha }}"

      - name: Weryfikacja APK release
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)

          test -n "$APK" && test -s "$APK" && unzip -tq "$APK" >/dev/null || {
            echo "::error::Brak lub uszkodzony APK release"
            exit 1
          }

          {
            echo "- APK release: $APK ($(stat -c%s "$APK") B)"
            echo "- SHA256: $(sha256sum "$APK" | cut -c1-16)…"
            echo "- Podpis: NIEPODPISANE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zatrzymaj backend
        if: always()
        run: |
          pkill -f '[s]hyfr_server.server' || true

      - name: Publikacja APK release
        uses: actions/upload-artifact@v4
        with:
          name: shyfr-release-apk-niepodpisany
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Raporty testów i lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow-i-lint
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
